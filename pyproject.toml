[project]
name = "calculateremainingannualpensionallowance"
version = "2.0"
description = "Forecast the UK pension annual allowance available in a tax year, with carry forward"
authors = [
    {name = "John Pulford",email = "johnpulford@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.scripts]
pension-allowance = "calculateremainingannualpensionallowance.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculateremainingannualpensionallowance"]

[tool.pytest.ini_options]
# Tests run against the source tree, not the copy installed in the Nix venv.
pythonpath = ["src"]
testpaths = ["tests"]
