[project]
name = "calculateremainingannualpensionallowance"
version = "2.0"
description = "Forecast the UK pension annual allowance available in a tax year, with carry forward"
authors = [
    {name = "John Pulford",email = "johnpulford@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.scripts]
pension-allowance = "calculateremainingannualpensionallowance.cli:main"

[tool.poetry]
packages = [{include = "calculateremainingannualpensionallowance", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
